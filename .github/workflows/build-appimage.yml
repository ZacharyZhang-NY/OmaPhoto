name: Build AppImage

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-appimage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    name: Build AppImage (x86_64)
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake ninja-build qt6-base-dev qt6-base-dev-tools libgl1-mesa-dev qt6-wayland \
            fonts-dejavu-core qt6-image-formats-plugins libheif-dev libheif-plugin-libde265 \
            libfontconfig-dev ca-certificates curl dpkg-dev file fakeroot \
            patchelf desktop-file-utils \
            libx11-6 libxcb1 libxkbcommon0 libxkbcommon-x11-0 libsm6 libice6 \
            libgl1 libegl1 libopengl0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-cursor0

      - name: Install ONNX Runtime
        run: |
          curl -fsSL -o /tmp/ort.tgz \
            https://github.com/microsoft/onnxruntime/releases/download/v1.21.0/onnxruntime-linux-x64-1.21.0.tgz
          echo "7485c7e7aac6501b27e353dcbe068e45c61ab51fbaf598d13970dfae669d20bf  /tmp/ort.tgz" | sha256sum -c -
          mkdir -p /tmp/ort
          tar -xzf /tmp/ort.tgz -C /tmp/ort --strip-components=1
          sudo mkdir -p /usr/local/include/onnxruntime /usr/local/lib64 /usr/local/lib/cmake /usr/local/share/doc/onnxruntime
          sudo cp -r /tmp/ort/include/. /usr/local/include/onnxruntime/
          sudo mv /tmp/ort/lib/cmake/onnxruntime /usr/local/lib/cmake/
          sudo cp -a /tmp/ort/lib/. /usr/local/lib64/
          sudo cp /tmp/ort/LICENSE /tmp/ort/ThirdPartyNotices.txt /usr/local/share/doc/onnxruntime/
          echo /usr/local/lib64 | sudo tee /etc/ld.so.conf.d/onnxruntime.conf
          sudo ldconfig
          rm -rf /tmp/ort /tmp/ort.tgz

      - name: Download Remove Background model
        run: |
          mkdir -p /tmp/omaphoto-share
          curl -fsSL -o /tmp/omaphoto-share/u2net.onnx \
            https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2net.onnx
          echo "8d10d2f3bb75ae3b6d527c77944fc5e7dcd94b29809d47a739a7a728a912b491  /tmp/omaphoto-share/u2net.onnx" | sha256sum -c -

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DOMAPHOTO_BUNDLE_ORT=ON -DOMAPHOTO_MODEL=/tmp/omaphoto-share/u2net.onnx
          cmake --build build --target omaphoto

      - name: Install into AppDir
        run: |
          rm -rf AppDir
          DESTDIR="${{ github.workspace }}/AppDir" cmake --install build

      - name: Deploy Qt dependencies into AppDir
        env:
          QMAKE: /usr/lib/qt6/bin/qmake6
        run: |
          wget -c https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -c https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appimage-extract
          mv squashfs-root squashfs-root-linuxdeploy
          ./linuxdeploy-plugin-qt-x86_64.AppImage --appimage-extract
          mv squashfs-root squashfs-root-linuxdeploy-qt
          export PATH="${PWD}/squashfs-root-linuxdeploy-qt/usr/bin:${PATH}"

          # Bundle the libraries linuxdeploy assumes the host already has (X11, GL/EGL,
          # GLVND's libGL/libGLX/libGLdispatch/libOpenGL split), so the AppImage is
          # self-contained. Each soname is resolved via ldconfig rather than a hardcoded path.
          RUNTIME_LIBS="libX11.so.6 libxcb.so.1 libxkbcommon.so.0 libxkbcommon-x11.so.0 \
            libSM.so.6 libICE.so.6 libGL.so.1 libGLX.so.0 libGLdispatch.so.0 libEGL.so.1 libOpenGL.so.0 \
            libxcb-icccm.so.4 libxcb-image.so.0 libxcb-keysyms.so.1 \
            libxcb-render-util.so.0 libxcb-cursor.so.0 libgpg-error.so.0"
          LIBRARY_ARGS=""
          for lib in $RUNTIME_LIBS; do
            path=$(ldconfig -p | awk -v l="$lib" '$1==l {print $NF; exit}')
            if [ -z "$path" ]; then
              echo "::error::$lib not found via ldconfig - add its package to 'Install build dependencies'" >&2
              exit 1
            fi
            LIBRARY_ARGS="$LIBRARY_ARGS --library=$path"
          done

          ./squashfs-root-linuxdeploy/usr/bin/linuxdeploy \
            --appdir AppDir \
            --executable AppDir/usr/bin/omaphoto \
            --desktop-file AppDir/usr/share/applications/io.github.ZacharyZhang_NY.OmaPhoto.desktop \
            --icon-file packaging/icons/app-icon-256.png \
            --plugin qt \
            $LIBRARY_ARGS

      - name: Download appimagetool
        run: |
          wget -c "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract

      - name: Bundle AppImage
        run: |
          export PATH="${PWD}/squashfs-root/usr/bin:${PATH}"
          ./squashfs-root/usr/bin/appimagetool \
            --updateinformation "gh-releases-zsync|${{ github.repository_owner }}|${{ github.event.repository.name }}|continuous|OmaPhoto-x86_64.AppImage.zsync" \
            AppDir OmaPhoto-x86_64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appimage-x86_64
          path: OmaPhoto-x86_64.AppImage*

  screenshot-debian:
    name: Launch on a minimal glibc distro and screenshot
    needs: build
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie-slim
      # For the gdb backtrace below; Docker's default seccomp profile blocks ptrace.
      options: --cap-add=SYS_PTRACE
    steps:
      - name: Download AppImage artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: appimage-x86_64

      # Nothing app-specific belongs here - every library the app needs is bundled
      # in the build job. Only test infrastructure (display, screenshot tooling).
      - name: Install test infrastructure (display, screenshot tooling - no app libraries)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            fonts-dejavu-core xvfb ffmpeg imagemagick ca-certificates \
            x11-utils gdb icewm

      - name: Launch OmaPhoto under Xvfb and screenshot it
        run: |
          chmod +x OmaPhoto-x86_64.AppImage
          ./OmaPhoto-x86_64.AppImage --appimage-extract

          Xvfb :99 -screen 0 1280x800x24 &
          XVFB_PID=$!
          sleep 2

          export DISPLAY=:99
          # A window manager is required for the window to actually get mapped and painted.
          icewm > /dev/null 2>&1 &
          ICEWM_PID=$!
          sleep 2
          export QT_QPA_PLATFORM=xcb
          # No AT-SPI/D-Bus/GPU in this container; disable the bits that would otherwise
          # hang or stall trying to reach them instead of failing fast.
          export QT_ACCESSIBILITY=0
          export DBUS_SESSION_BUS_ADDRESS=disabled:
          export QT_XCB_GL_INTEGRATION=none
          export LIBGL_ALWAYS_SOFTWARE=1
          mkdir -p -m0700 /tmp/runtime-root
          export XDG_RUNTIME_DIR=/tmp/runtime-root
          export QT_DEBUG_PLUGINS=1
          ./squashfs-root/AppRun &
          APP_PID=$!

          # Poll for up to 15s for an actual window owned by the app (matched by
          # WM_CLASS), then check its content isn't flat - a window manager's own
          # desktop chrome is non-flat by itself, so a bare pixel check alone could
          # pass even if the app crashed on startup.
          START=$(date +%s)
          STDDEV=0
          WINDOW_FOUND=0
          while [ "$(( $(date +%s) - START ))" -lt 15 ]; do
            sleep 2
            if xwininfo -tree -root 2>/dev/null | grep -q '"OmaPhoto")'; then
              WINDOW_FOUND=1
            else
              echo "OmaPhoto window not found yet" >&2
              continue
            fi
            ffmpeg -y -f x11grab -video_size 1280x800 -i "$DISPLAY" -frames:v 1 screenshot.png -loglevel error || {
              echo "ffmpeg capture failed, retrying" >&2; continue; }
            if IDENTIFY_OUT=$(identify -format "%[fx:standard_deviation]" screenshot.png 2>&1); then
              STDDEV="$IDENTIFY_OUT"
            else
              echo "identify failed: $IDENTIFY_OUT" >&2
              STDDEV=0
            fi
            echo "OmaPhoto window found, frame stddev: $STDDEV" >&2
            if awk -v v="$STDDEV" 'BEGIN { exit !(v > 0.02) }'; then
              break
            fi
          done

          # If it's still running but never rendered, capture a backtrace before killing it.
          echo "xwininfo window list:" >&2
          timeout 10 xwininfo -tree -root >&2 2>&1 || true
          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "AppRun (pid $APP_PID) is still running after the 15s retry window - backtracing it:" >&2
            REAL_PID=$(pgrep -P "$APP_PID" -f omaphoto || echo "$APP_PID")
            timeout 15 gdb -p "$REAL_PID" --batch -ex "thread apply all bt" >&2 2>&1 || true
          else
            echo "AppRun (pid $APP_PID) has already exited" >&2
          fi

          kill "$APP_PID" 2>/dev/null || true
          kill "$ICEWM_PID" 2>/dev/null || true
          kill "$XVFB_PID" 2>/dev/null || true

          if [ "$WINDOW_FOUND" -ne 1 ]; then
            echo "::error::no window owned by OmaPhoto ever appeared in 15s - it likely crashed or failed to start (see the backtrace/exit status above)" >&2
            exit 1
          fi
          test -s screenshot.png
          if ! awk -v v="$STDDEV" 'BEGIN { exit !(v > 0.02) }'; then
            echo "::error::OmaPhoto's window exists but screenshot.png still looks blank/flat after 15s (pixel stddev=$STDDEV)" >&2
            exit 1
          fi

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshot
          path: screenshot.png
          if-no-files-found: ignore

  screenshot-alpine:
    name: Launch on a minimal musl distro (Alpine) and screenshot
    needs: build
    runs-on: ubuntu-24.04
    container:
      image: alpine:3.20
      options: --cap-add=SYS_PTRACE
    steps:
      # actions/* run via a glibc Node binary the runner injects from the host, which
      # can't exec inside a musl container without this.
      - name: Install glibc compat for the injected actions runtime
        run: apk add --no-cache libc6-compat

      - name: Download AppImage artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: appimage-x86_64

      # gcompat (Alpine's official shim) is missing GLIBC_2.38-era symbols this
      # payload needs, so use a real, up to date glibc build instead - a third-party
      # apk repo and signing key, not an official Alpine package.
      - name: Install a real glibc (gcompat is not complete enough for this payload)
        run: |
          GLIBC_VER=2.44
          wget -q -O /etc/apk/keys/alpine-packaging-rsa.pub \
            https://raw.githubusercontent.com/dalet-oss/alpine-glibc/master/alpine-packaging-rsa.pub
          wget -q "https://github.com/dalet-oss/alpine-glibc/releases/download/${GLIBC_VER}-amd64-r1/glibc-${GLIBC_VER}.apk"
          wget -q "https://github.com/dalet-oss/alpine-glibc/releases/download/${GLIBC_VER}-amd64-r1/glibc-bin-${GLIBC_VER}.apk"
          apk add --no-cache --force-overwrite "glibc-${GLIBC_VER}.apk" "glibc-bin-${GLIBC_VER}.apk"
          rm -f "glibc-${GLIBC_VER}.apk" "glibc-bin-${GLIBC_VER}.apk"

      - name: Install test infrastructure (display, screenshot tooling - no app libraries)
        run: |
          apk add --no-cache \
            ttf-dejavu xvfb ffmpeg imagemagick ca-certificates \
            xwininfo gdb icewm

      - name: Launch OmaPhoto under Xvfb and screenshot it
        run: |
          chmod +x OmaPhoto-x86_64.AppImage
          ./OmaPhoto-x86_64.AppImage --appimage-extract

          Xvfb :99 -screen 0 1280x800x24 &
          XVFB_PID=$!
          sleep 2

          export DISPLAY=:99
          icewm > /dev/null 2>&1 &
          ICEWM_PID=$!
          sleep 2
          export QT_QPA_PLATFORM=xcb
          export QT_ACCESSIBILITY=0
          export DBUS_SESSION_BUS_ADDRESS=disabled:
          export QT_XCB_GL_INTEGRATION=none
          export LIBGL_ALWAYS_SOFTWARE=1
          mkdir -p -m0700 /tmp/runtime-root
          export XDG_RUNTIME_DIR=/tmp/runtime-root
          export QT_DEBUG_PLUGINS=1
          ./squashfs-root/AppRun &
          APP_PID=$!

          # Same window + content check as the Debian job.
          START=$(date +%s)
          STDDEV=0
          WINDOW_FOUND=0
          while [ "$(( $(date +%s) - START ))" -lt 15 ]; do
            sleep 2
            if xwininfo -tree -root 2>/dev/null | grep -q '"OmaPhoto")'; then
              WINDOW_FOUND=1
            else
              echo "OmaPhoto window not found yet" >&2
              continue
            fi
            ffmpeg -y -f x11grab -video_size 1280x800 -i "$DISPLAY" -frames:v 1 screenshot-alpine.png -loglevel error || {
              echo "ffmpeg capture failed, retrying" >&2; continue; }
            if IDENTIFY_OUT=$(identify -format "%[fx:standard_deviation]" screenshot-alpine.png 2>&1); then
              STDDEV="$IDENTIFY_OUT"
            else
              echo "identify failed: $IDENTIFY_OUT" >&2
              STDDEV=0
            fi
            echo "OmaPhoto window found, frame stddev: $STDDEV" >&2
            if awk -v v="$STDDEV" 'BEGIN { exit !(v > 0.02) }'; then
              break
            fi
          done

          echo "xwininfo window list:" >&2
          timeout 10 xwininfo -tree -root >&2 2>&1 || true
          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "AppRun (pid $APP_PID) is still running after the 15s retry window - backtracing it:" >&2
            timeout 15 gdb -p "$APP_PID" --batch -ex "thread apply all bt" >&2 2>&1 || true
          else
            echo "AppRun (pid $APP_PID) has already exited" >&2
          fi

          kill "$APP_PID" 2>/dev/null || true
          kill "$ICEWM_PID" 2>/dev/null || true
          kill "$XVFB_PID" 2>/dev/null || true

          if [ "$WINDOW_FOUND" -ne 1 ]; then
            echo "::error::no window owned by OmaPhoto ever appeared in 15s - it likely crashed or failed to start (see the backtrace/exit status above)" >&2
            exit 1
          fi
          test -s screenshot-alpine.png
          if ! awk -v v="$STDDEV" 'BEGIN { exit !(v > 0.02) }'; then
            echo "::error::OmaPhoto's window exists but screenshot-alpine.png still looks blank/flat after 15s (pixel stddev=$STDDEV)" >&2
            exit 1
          fi

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshot-alpine
          path: screenshot-alpine.png
          if-no-files-found: ignore

  upload:
    name: Create release
    needs: [build, screenshot-debian, screenshot-alpine]
    # Debian gates the release; Alpine is optional (its screenshot is included when
    # it succeeds, but a release still ships without it if it fails).
    if: |
      always() && github.event_name == 'push' &&
      needs.build.result == 'success' && needs.screenshot-debian.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0

      - name: Create release and upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP 'project\(omaphoto VERSION \K[0-9.]+' CMakeLists.txt)
          wget -q https://github.com/TheAssassin/pyuploadtool/releases/download/continuous/pyuploadtool-x86_64.AppImage
          chmod +x pyuploadtool-x86_64.AppImage
          FILES="screenshot/screenshot.png"
          [ -f screenshot-alpine/screenshot-alpine.png ] && FILES="$FILES screenshot-alpine/screenshot-alpine.png"
          GITHUB_RELEASE_NAME="$VERSION" GITHUB_CONTINUOUS_RELEASE_TYPE=prerelease \
            ./pyuploadtool-x86_64.AppImage **/OmaPhoto*.AppImage* $FILES

      - name: Add the screenshot(s) to the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) TAG="${GITHUB_REF#refs/tags/}" ;;
            *) TAG="continuous" ;;
          esac
          gh release view "$TAG" --repo "${{ github.repository }}" --json body --jq .body > notes.md
          {
            echo ""
            echo ""
            echo "## Running on a stock minimal Debian"
            echo ""
            echo "![OmaPhoto running on a stock minimal Debian](https://github.com/${{ github.repository }}/releases/download/$TAG/screenshot.png)"
          } >> notes.md
          if [ -f screenshot-alpine/screenshot-alpine.png ]; then
            {
              echo ""
              echo "## Running on a stock minimal Alpine"
              echo ""
              echo "![OmaPhoto running on a stock minimal Alpine](https://github.com/${{ github.repository }}/releases/download/$TAG/screenshot-alpine.png)"
            } >> notes.md
          fi
          gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file notes.md
