name: Build AppImage

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    name: Build AppImage (x86_64)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake ninja-build qt6-base-dev qt6-base-dev-tools libgl1-mesa-dev qt6-wayland \
            fonts-dejavu-core qt6-image-formats-plugins libheif-dev libheif-plugin-libde265 \
            libfontconfig-dev ca-certificates curl dpkg-dev file fakeroot \
            patchelf desktop-file-utils

      - name: Install ONNX Runtime
        run: |
          curl -fsSL -o /tmp/ort.tgz \
            https://github.com/microsoft/onnxruntime/releases/download/v1.21.0/onnxruntime-linux-x64-1.21.0.tgz
          echo "7485c7e7aac6501b27e353dcbe068e45c61ab51fbaf598d13970dfae669d20bf  /tmp/ort.tgz" | sha256sum -c -
          mkdir -p /tmp/ort
          tar -xzf /tmp/ort.tgz -C /tmp/ort --strip-components=1
          sudo mkdir -p /usr/local/include/onnxruntime /usr/local/lib64 /usr/local/lib/cmake /usr/local/share/doc/onnxruntime
          sudo cp -r /tmp/ort/include/. /usr/local/include/onnxruntime/
          sudo mv /tmp/ort/lib/cmake/onnxruntime /usr/local/lib/cmake/
          sudo cp -a /tmp/ort/lib/. /usr/local/lib64/
          sudo cp /tmp/ort/LICENSE /tmp/ort/ThirdPartyNotices.txt /usr/local/share/doc/onnxruntime/
          echo /usr/local/lib64 | sudo tee /etc/ld.so.conf.d/onnxruntime.conf
          sudo ldconfig
          rm -rf /tmp/ort /tmp/ort.tgz

      - name: Download Remove Background model
        run: |
          mkdir -p /tmp/omaphoto-share
          curl -fsSL -o /tmp/omaphoto-share/u2net.onnx \
            https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2net.onnx
          echo "8d10d2f3bb75ae3b6d527c77944fc5e7dcd94b29809d47a739a7a728a912b491  /tmp/omaphoto-share/u2net.onnx" | sha256sum -c -

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DOMAPHOTO_BUNDLE_ORT=ON -DOMAPHOTO_MODEL=/tmp/omaphoto-share/u2net.onnx
          cmake --build build --target omaphoto

      - name: Install into AppDir
        run: |
          rm -rf AppDir
          DESTDIR="${{ github.workspace }}/AppDir" cmake --install build

      - name: Deploy Qt dependencies into AppDir
        env:
          QMAKE: /usr/lib/qt6/bin/qmake6
        run: |
          wget -c https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -c https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appimage-extract
          mv squashfs-root squashfs-root-linuxdeploy
          ./linuxdeploy-plugin-qt-x86_64.AppImage --appimage-extract
          mv squashfs-root squashfs-root-linuxdeploy-qt
          export PATH="${PWD}/squashfs-root-linuxdeploy-qt/usr/bin:${PATH}"
          ./squashfs-root-linuxdeploy/usr/bin/linuxdeploy \
            --appdir AppDir \
            --executable AppDir/usr/bin/omaphoto \
            --desktop-file AppDir/usr/share/applications/io.github.ZacharyZhang_NY.OmaPhoto.desktop \
            --icon-file packaging/icons/app-icon-256.png \
            --plugin qt

      - name: Download appimagetool
        run: |
          wget -c "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract

      - name: Bundle AppImage
        run: |
          export PATH="${PWD}/squashfs-root/usr/bin:${PATH}"
          ./squashfs-root/usr/bin/appimagetool \
            --updateinformation "gh-releases-zsync|${{ github.repository_owner }}|${{ github.event.repository.name }}|continuous|OmaPhoto-x86_64.AppImage.zsync" \
            AppDir OmaPhoto-x86_64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage-x86_64
          path: OmaPhoto-x86_64.AppImage*

  screenshot-alpine:
    name: Launch on stock Alpine and screenshot
    needs: build
    runs-on: ubuntu-24.04
    container:
      image: alpine:3.20
    steps:
      # actions/* run via a Node binary the runner injects from the host, which is
      # glibc-linked; without a compat shim it can't even exec inside a musl container.
      - name: Install glibc compat for the injected actions runtime
        run: apk add --no-cache libc6-compat

      - name: Download AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: appimage-x86_64

      - name: Install the packages needed to run the AppImage and take a screenshot
        run: |
          # gcompat only fakes a handful of glibc symbols and left dozens unresolved
          # (GLIBC_2.38 additions such as __isoc23_strtol, renameat2, close_range,
          # pthread_cond_clockwait) because the AppImage was built against Ubuntu 24.04's
          # glibc 2.39. sgerrand/alpine-pkg-glibc is the usual real-glibc source for Alpine
          # but stopped at glibc 2.35, which predates GLIBC_2.38, so it would not help
          # either. dalet-oss/alpine-glibc continues that same packaging up to date, so use
          # its glibc 2.44 build instead - this is an unofficial, third-party apk repo.
          GLIBC_VER=2.44
          wget -q -O /etc/apk/keys/alpine-packaging-rsa.pub \
            https://raw.githubusercontent.com/dalet-oss/alpine-glibc/master/alpine-packaging-rsa.pub
          wget -q "https://github.com/dalet-oss/alpine-glibc/releases/download/${GLIBC_VER}-amd64-r1/glibc-${GLIBC_VER}.apk"
          wget -q "https://github.com/dalet-oss/alpine-glibc/releases/download/${GLIBC_VER}-amd64-r1/glibc-bin-${GLIBC_VER}.apk"
          apk add --no-cache --force-overwrite "glibc-${GLIBC_VER}.apk" "glibc-bin-${GLIBC_VER}.apk"
          rm -f "glibc-${GLIBC_VER}.apk" "glibc-bin-${GLIBC_VER}.apk"

          # Qt's xcb platform plugin itself (not just the app) needs the small xcb-util
          # helper libraries (icccm/wm, image, keysyms, render-util, cursor) - without them
          # dlopen() of libqxcb.so fails and Qt reports "plugin was found" but could not be
          # initialized. QT_DEBUG_PLUGINS=1 then showed the plugin still failed to dlopen
          # because of a missing libSM.so.6 (X11 session-management), which in turn pulls in
          # libICE.so.6 - install libsm/libice for those. imagemagick is only needed for the
          # "did the app actually paint anything" check in the next step.
          apk add --no-cache libx11 libxcb libxkbcommon libxkbcommon-x11 libsm libice \
            xcb-util xcb-util-wm xcb-util-image xcb-util-keysyms xcb-util-renderutil xcb-util-cursor \
            mesa-gl mesa-dri-gallium ttf-dejavu xvfb ffmpeg imagemagick

          # The AppImage links against Ubuntu's GLVND libGLX.so.0/libOpenGL.so.0, but
          # Alpine's mesa-gl only ships the classic monolithic libGL.so.1, which already
          # exports the same GLX and GL symbols - point the GLVND sonames at it instead of
          # trying to bring in a GLVND stack Alpine does not package. AppRun still failed to
          # load libGLX.so.0 after this symlink alone: real glibc's ld.so resolves sonames
          # from its ld.so.cache, which was built by the glibc-bin trigger before these
          # symlinks existed, so the new names never made it into the cache. Export the
          # symlink directory as LD_LIBRARY_PATH for the launch step instead, since that is
          # consulted directly at load time and does not depend on the cache being current.
          GL_LIB=$(find /usr/lib /usr/lib64 /lib /lib64 -name 'libGL.so.1' 2>/dev/null | head -1)
          GL_DIR=$(dirname "$GL_LIB")
          ln -sf "$GL_LIB" "$GL_DIR/libGLX.so.0"
          ln -sf "$GL_LIB" "$GL_DIR/libOpenGL.so.0"
          echo "GL_DIR=$GL_DIR" >> "$GITHUB_ENV"

      - name: Launch OmaPhoto under Xvfb and screenshot it
        run: |
          chmod +x OmaPhoto-x86_64.AppImage
          ./OmaPhoto-x86_64.AppImage --appimage-extract

          Xvfb :99 -screen 0 1280x800x24 &
          XVFB_PID=$!
          sleep 2

          export DISPLAY=:99
          export QT_QPA_PLATFORM=xcb
          export LD_LIBRARY_PATH="$GL_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          # Prints why a QPA plugin candidate was rejected, in case xcb still won't load -
          # otherwise Qt only reports that it "was found" but not why dlopen() failed.
          export QT_DEBUG_PLUGINS=1
          # With xcb finally loading, QT_DEBUG_PLUGINS showed startup stall for good after
          # "checking directory path .../accessiblebridge": Qt6's Linux accessibility bridge
          # tries to reach the AT-SPI registry over D-Bus, and this container has no D-Bus
          # daemon at all, so it blocks until our own timeout gave up rather than failing
          # fast. Disable Qt's accessibility bridge outright since nothing here needs it.
          export QT_ACCESSIBILITY=0
          ./squashfs-root/AppRun &
          APP_PID=$!

          # A single fixed sleep-then-grab could catch the window before it has painted
          # anything, passing `test -s` on a screenshot that is really just a blank/solid
          # frame. Instead poll for up to 15s, re-grabbing every ~2s, and stop as soon as a
          # frame's pixel stddev shows it is not flat - i.e. something was actually drawn.
          START=$(date +%s)
          STDDEV=0
          while [ "$(( $(date +%s) - START ))" -lt 15 ]; do
            sleep 2
            ffmpeg -y -f x11grab -video_size 1280x800 -i "$DISPLAY" -frames:v 1 screenshot.png -loglevel error
            STDDEV=$(identify -format "%[fx:image.stdDev]" screenshot.png 2>/dev/null || echo 0)
            if awk -v v="$STDDEV" 'BEGIN { exit !(v > 0.02) }'; then
              break
            fi
          done

          kill "$APP_PID" 2>/dev/null || true
          kill "$XVFB_PID" 2>/dev/null || true

          test -s screenshot.png
          if ! awk -v v="$STDDEV" 'BEGIN { exit !(v > 0.02) }'; then
            echo "screenshot.png still looks blank/flat after 15s (pixel stddev=$STDDEV) - the app did not render" >&2
            exit 1
          fi

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: alpine-screenshot
          path: screenshot.png

  upload:
    name: Create release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create release and upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP 'project\(omaphoto VERSION \K[0-9.]+' CMakeLists.txt)
          wget -q https://github.com/TheAssassin/pyuploadtool/releases/download/continuous/pyuploadtool-x86_64.AppImage
          chmod +x pyuploadtool-x86_64.AppImage
          GITHUB_RELEASE_NAME="$VERSION" GITHUB_CONTINUOUS_RELEASE_TYPE=stable \
            ./pyuploadtool-x86_64.AppImage **/OmaPhoto*.AppImage*
